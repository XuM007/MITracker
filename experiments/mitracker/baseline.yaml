  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 250 
  SCHEDULER:
    TYPE: step 
    DECAY_RATE: 0.1 
  VAL_EPOCH_INTERVAL: 5 
  WEIGHT_DECAY: 0.0001
  AMP: False 
  
TEST:
  EPOCH: 50
  SEARCH_FACTOR: 5.0
  SEARCH_SIZE: 364 
  TEMPLATE_FACTOR: 2.0 
  TEMPLATE_SIZE: 182 
  TEMPLATE_NUMBER: 1 
  MEMORY_THRESHOLD: 1000 
  CAMERAS: 'real'
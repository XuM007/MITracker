MODEL:
  PRETRAIN_FILE: " "
  PRETRAIN_PTH: "./output/checkpoints/train/mitracker_stage1/baseline/MITrackerStage1_ep0070.pth.tar"
  PRETRAIN_LAYER:
  - 'backbone'
  RETURN_INTER: False
  BACKBONE:

    STRIDE: 14
    ADD_CLS_TOKEN: True             
    ATTN_TYPE: concat            
    HEATMAP_CHANNEL: 32      
  HEAD:
    TYPE: CENTER 
    NUM_CHANNELS: 256 
  PROJECT:
    BOUNDS: [0, 400, 0, 400, 0, 3] 
    WORLD_SHAPE: [8, 8, 3] 
    SCENE_CENTROID: [0.0, 0.0, 0.0]
    CAMERAS: 'real' 
    RESOLUTION: [200, 3, 200]
    ZSIGN: 1
    
TRAIN:
  BBOX_TASK: True
  BACKBONE_MULTIPLIER: 0.01 
  DROP_PATH_RATE: 0.1 
  BATCH_SIZE: 4 
  NUM_WORKER: 8 
  EPOCH: 50 
  LR_DROP_EPOCH: 40 
  GIOU_WEIGHT: 2.0 
  L1_WEIGHT: 5.0 
  BEV_WEIGHT: 0.1 
  GRAD_CLIP_NORM: 0.1  
